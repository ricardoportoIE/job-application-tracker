[project]
name = "backend"
version = "0.1.0"
description = "Production-oriented FastAPI backend for tracking job applications, companies, hiring stages, and application history."
readme = "README.md"
authors = [{ name = "Ricardo Porto", email = "ricardoportooliveira@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1,<2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
