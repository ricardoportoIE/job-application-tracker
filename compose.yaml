services:
  postgres:
    image: postgres:17-alpine
    container_name: job-tracker-postgres

    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: job-tracker-backend
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      APP_NAME: Job Application Tracker API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development

      DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker_dev@postgres:5432/jobtracker
      TEST_DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker_dev@postgres:5432/jobtracker_test

      JWT_SECRET_KEY: local-docker-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      CORS_ALLOW_CREDENTIALS: "true"

      LOG_LEVEL: INFO

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
