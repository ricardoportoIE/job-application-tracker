name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_NAME: Job Application Tracker API
      APP_VERSION: 0.1.0
      ENVIRONMENT: test

      DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker_dev@localhost:5432/jobtracker
      TEST_DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker_dev@localhost:5432/jobtracker_test

      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      CORS_ALLOW_CREDENTIALS: "true"

      LOG_LEVEL: INFO

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: jobtracker
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker_dev

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: jobtracker_dev
        run: |
          psql \
            --host=localhost \
            --username=jobtracker \
            --dbname=postgres \
            --command="CREATE DATABASE jobtracker_test;"

      - name: Run main database migrations
        run: uv run alembic upgrade head

      - name: Check Alembic model consistency
        run: uv run alembic check

      - name: Run test database migrations
        env:
          DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker_dev@localhost:5432/jobtracker_test
        run: uv run alembic upgrade head

      - name: Run Ruff lint
        run: uv run python -m ruff check .

      - name: Check Ruff formatting
        run: uv run python -m ruff format --check .

      - name: Run MyPy
        run: uv run python -m mypy app

      - name: Run tests
        run: uv run python -m pytest
