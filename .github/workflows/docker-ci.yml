name: Docker CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".github/workflows/docker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Application Images Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend production image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: job-application-tracker-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend production image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: job-application-tracker-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Smoke test the complete application stack
        run: |
          docker compose up --detach --build --wait
          curl --fail --show-error http://localhost:8000/ready
          curl --fail --show-error http://localhost:5173/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5173/api/v1/auth/me)" = "401"
      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes
